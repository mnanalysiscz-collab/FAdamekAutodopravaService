  <style>
    :root{--bg:#090e13;--bg2:#0d141b;--text:#f7f7f7;--muted:#aeb7c0;--line:rgba(255,255,255,.10);--orange:#ef7b10;--max:1500px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--text);background:linear-gradient(145deg,#0d151c,#090e13 58%,#0d151c);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;min-height:100vh}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    .container{width:min(var(--max),calc(100% - 48px));margin-inline:auto}

    .site-header{position:relative;height:80px;z-index:20;background:#090e13;border-bottom:1px solid var(--line)}
    .nav{height:80px;display:grid;grid-template-columns:260px 1fr 190px;align-items:center;gap:28px}
    .site-header .container{width:100%;max-width:none;padding-left:18px;padding-right:18px}
    .brand{display:block;justify-self:start}
    .brand img{width:270px;max-height:68px;object-fit:contain;object-position:left center;opacity:.98;filter:drop-shadow(0 0 5px rgba(255,255,255,.32)) drop-shadow(0 0 14px rgba(239,123,16,.22))}
    .nav-links{display:flex;justify-content:center;align-items:center;gap:30px;font-size:13px;font-weight:700}
    .nav-links a{color:rgba(255,255,255,.86);padding:28px 0;position:relative}
    .nav-links a:hover{color:#fff}
    .nav-links a.active{color:#fff}
    .nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:19px;height:2px;background:var(--orange)}
    .phone{justify-self:end;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;padding:0 15px;border:1px solid rgba(239,123,16,.60);border-radius:5px;background:rgba(5,10,15,.28);color:#fff;font-size:13px;font-weight:850;white-space:nowrap}
    .phone svg{width:14px;height:14px;stroke:#fff}

    .gallery-hero{padding:76px 0 40px;text-align:center}
    .eyebrow{margin:0 0 12px;color:var(--orange);font-size:11px;font-weight:800;letter-spacing:.34em;text-transform:uppercase}
    .gallery-hero h1{margin:0;font-size:clamp(42px,5.6vw,82px);line-height:.98;letter-spacing:-.055em}
    .gallery-hero p{margin:20px auto 0;max-width:680px;color:var(--muted);font-size:16px}
    .gallery-line{width:72px;height:2px;margin:25px auto 0;background:var(--orange)}

    .gallery-section{padding:20px 0 90px}
    .gallery-section .container{width:min(1180px,calc(100% - 48px))}
    .gallery-grid{
      position:relative;
      columns:2;
      column-gap:46px;
      column-rule:3px solid var(--orange)
    }
    .gallery-grid::after{
      content:"";
      position:absolute;
      z-index:2;
      left:50%;
      top:36px;
      bottom:36px;
      width:16px;
      transform:translateX(-50%);
      background:radial-gradient(circle at center,var(--orange) 0 5px,#090e13 5.5px 8px,transparent 8.5px) center top/16px 180px repeat-y;
      pointer-events:none
    }
    .gallery-item{position:relative;display:block;width:100%;margin:0 0 16px;padding:0;appearance:none;-webkit-appearance:none;color:inherit;font:inherit;break-inside:avoid;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:7px;background:#10161b;cursor:zoom-in}
    .gallery-item img{width:100%;height:auto;transition:transform .35s ease,filter .35s ease}
    .gallery-item::after{content:"+";position:absolute;right:16px;bottom:14px;width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:rgba(5,10,15,.58);color:#fff;font-size:22px;font-weight:300;opacity:0;transform:translateY(6px);transition:.25s ease}
    .gallery-item:hover img{transform:scale(1.015);filter:brightness(.82)}
    .gallery-item:hover::after{opacity:1;transform:none}

    .back-link{display:flex;justify-content:center;padding:0 0 80px}
    .back-link a{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border:1px solid rgba(255,255,255,.22);border-radius:5px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;transition:.2s ease}
    .back-link a:hover{border-color:var(--orange);color:#ffd1a1;transform:translateY(-1px)}

    footer{padding:28px 0;background:#080d11;border-top:1px solid var(--line);color:#7e8892;font-size:12px}
    .footer-inner{display:flex;justify-content:space-between;align-items:flex-end;gap:28px}
    .footer-business,.footer-meta{display:flex;flex-direction:column;gap:5px}
    .footer-meta{align-items:flex-end;text-align:right}
    .footer-top{color:#aeb7c0;transition:color .2s ease}
    .footer-top:hover,.footer-top:focus-visible{color:#fff}
    .footer-credit a{color:var(--orange);font-weight:800;transition:color .2s ease,text-shadow .2s ease}
    .footer-credit a:hover,.footer-credit a:focus-visible{color:#ff9437;text-shadow:0 0 10px rgba(239,123,16,.35)}

    .lightbox{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:34px;background:rgba(0,0,0,.94);backdrop-filter:blur(5px)}
    .lightbox.open{display:flex}
    .lightbox img{max-width:min(92vw,1500px);max-height:90vh;object-fit:contain;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;border:1px solid rgba(255,255,255,.22);background:rgba(12,16,20,.62);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s ease}
    .lightbox-close{top:20px;right:22px;width:46px;height:46px;border-radius:50%;font-size:27px}
    .lightbox-prev,.lightbox-next{top:50%;width:50px;height:64px;transform:translateY(-50%);border-radius:5px;font-size:30px}
    .lightbox-prev{left:22px}.lightbox-next{right:22px}
    .lightbox-close:hover,.lightbox-prev:hover,.lightbox-next:hover{border-color:var(--orange);color:#ffd1a1}
    .lightbox-counter{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);color:#c8ced3;font-size:12px;letter-spacing:.12em}

    @media(max-width:1050px){.nav{grid-template-columns:1fr auto}.nav-links{display:none}.gallery-grid{column-gap:34px}}
    @media(max-width:640px){
      .container{width:min(var(--max),calc(100% - 30px))}
      .site-header{height:74px}.nav{height:74px}.brand img{width:175px}.phone{font-size:0;padding:0 13px;min-height:39px}.phone svg{width:16px;height:16px}
      .gallery-hero{padding:54px 0 30px}.gallery-section .container{width:min(1180px,calc(100% - 30px))}.gallery-grid{columns:1;column-gap:0;column-rule:0;padding-left:14px;border-left:3px solid var(--orange)}.gallery-grid::after{display:none}.gallery-item{margin-bottom:10px}.gallery-section{padding-top:8px}
      .lightbox{padding:18px}.lightbox-prev,.lightbox-next{width:42px;height:54px}.lightbox-prev{left:8px}.lightbox-next{right:8px}.lightbox-close{top:10px;right:10px}
      .footer-inner{flex-direction:column;align-items:stretch}.footer-meta{align-items:flex-end;text-align:right}
    }
  </style>

<script>
  const items=[...document.querySelectorAll('.gallery-item')];
  const lightbox=document.getElementById('lightbox');
  const lightboxImage=document.getElementById('lightboxImage');
  const counter=document.getElementById('lightboxCounter');
  let currentIndex=0;

  function showImage(index){
    currentIndex=(index+items.length)%items.length;
    const img=items[currentIndex].querySelector('img');
    lightboxImage.src=items[currentIndex].dataset.src;
    lightboxImage.alt=img.alt;
    counter.textContent=(currentIndex+1)+' / '+items.length;
  }
  function openLightbox(index){showImage(index);lightbox.classList.add('open');document.body.style.overflow='hidden'}
  function closeLightbox(){lightbox.classList.remove('open');document.body.style.overflow=''}

  items.forEach((item,index)=>item.addEventListener('click',()=>openLightbox(index)));
  document.querySelector('.lightbox-close').addEventListener('click',closeLightbox);
  document.querySelector('.lightbox-prev').addEventListener('click',()=>showImage(currentIndex-1));
  document.querySelector('.lightbox-next').addEventListener('click',()=>showImage(currentIndex+1));
  lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});
  document.addEventListener('keydown',e=>{
    if(!lightbox.classList.contains('open'))return;
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')showImage(currentIndex-1);
    if(e.key==='ArrowRight')showImage(currentIndex+1);
  });
</script>
